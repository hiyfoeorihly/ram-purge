<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#0E1116"/>
  
  <!-- Outer gauge arc segments - memory bar arc -->
  <g fill="none" stroke-linecap="butt">
    <!-- Left segment (low memory) -->
    <path d="M 50 170 A 95 95 0 0 1 62 108" stroke="#E6EDF3" stroke-width="10" opacity="0.9"/>
    <!-- Second segment -->
    <path d="M 70 100 A 95 95 0 0 1 100 68" stroke="#2FD3C4" stroke-width="10"/>
    <!-- Third segment (top) -->
    <path d="M 108 64 A 95 95 0 0 1 148 64" stroke="#2FD3C4" stroke-width="10"/>
    <!-- Fourth segment -->
    <path d="M 156 68 A 95 95 0 0 1 186 100" stroke="#E6EDF3" stroke-width="10" opacity="0.75"/>
    <!-- Right segment (high memory) -->
    <path d="M 194 108 A 95 95 0 0 1 206 170" stroke="#FF6B4A" stroke-width="10"/>
  </g>

  <!-- Inner tick marks on the gauge arc -->
  <g stroke="#E6EDF3" stroke-width="2" opacity="0.5">
    <line x1="52" y1="168" x2="62" y2="164"/>
    <line x1="68" y1="136" x2="80" y2="138"/>
    <line x1="90" y1="110" x2="100" y2="116"/>
    <line x1="118" y1="94" x2="124" y2="102"/>
    <line x1="138" y1="94" x2="132" y2="102"/>
    <line x1="166" y1="110" x2="156" y2="116"/>
    <line x1="188" y1="136" x2="176" y2="138"/>
    <line x1="204" y1="168" x2="194" y2="164"/>
  </g>

  <!-- Tick marks on right side for venting detail -->
  <g stroke="#FF6B4A" stroke-width="3" stroke-linecap="round">
    <line x1="210" y1="130" x2="218" y2="128"/>
    <line x1="216" y1="148" x2="224" y2="148"/>
    <line x1="218" y1="166" x2="226" y2="168"/>
  </g>

  <!-- Central hub -->
  <circle cx="128" cy="160" r="12" fill="#E6EDF3"/>
  <circle cx="128" cy="160" r="6" fill="#0E1116"/>
  <circle cx="128" cy="160" r="2.5" fill="#2FD3C4"/>

  <!-- Needle sweeping through the arc -->
  <polygon points="128,160 185,88 178,92" fill="#2FD3C4"/>
  <polygon points="128,160 185,88 180,96" fill="#E6EDF3" opacity="0.85"/>
  
  <!-- Needle tip accent -->
  <circle cx="185" cy="88" r="4" fill="#FF6B4A"/>

  <!-- Venting pressure indicator - small arcs escaping from needle tip -->
  <g fill="none" stroke="#FF6B4A" stroke-width="2.5" stroke-linecap="round">
    <path d="M 195 80 Q 202 74 200 66"/>
    <path d="M 192 88 Q 200 84 202 76"/>
    <path d="M 200 92 Q 208 90 212 84"/>
  </g>

  <!-- Base bar under the gauge - precision instrument feel -->
  <rect x="48" y="196" width="160" height="6" fill="#2FD3C4" opacity="0.7"/>
  <rect x="48" y="206" width="160" height="2" fill="#E6EDF3" opacity="0.25"/>

  <!-- Left base detail - memory block indicators -->
  <g fill="#E6EDF3" opacity="0.6">
    <rect x="52" y="216" width="8" height="4"/>
    <rect x="64" y="216" width="8" height="4"/>
    <rect x="76" y="216" width="8" height="4" fill="#2FD3C4" opacity="0.9"/>
  </g>

  <!-- Right base detail -->
  <g fill="#FF6B4A" opacity="0.7">
    <rect x="172" y="216" width="8" height="4"/>
    <rect x="184" y="216" width="8" height="4"/>
    <rect x="196" y="216" width="8" height="4"/>
  </g>

  <!-- Wordmark small -->
  <text x="128" y="240" font-family="monospace, sans-serif" font-size="11" fill="#E6EDF3" text-anchor="middle" letter-spacing="3" opacity="0.8">RAM-PURGE</text>
</svg>
